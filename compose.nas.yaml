services:
  nas:
    image: ${NAS_IMAGE:-ghcr.io/longern/lantern-dock:latest}
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      SITE_ORIGIN: ${SITE_ORIGIN}
      ADMIN_SUBJECTS: ${ADMIN_SUBJECTS:-}
      NAS_RESOURCE_ORIGIN: ${NAS_RESOURCE_ORIGIN:-}
      SECRET_KEY: ${SECRET_KEY:?Set a persistent NAS SECRET_KEY of at least 32 characters}
    volumes:
      - type: bind
        source: ${PUBLIC_DIR:?Set PUBLIC_DIR to the folder you want to publish}
        target: /public
        read_only: true
      - nas-data:/data
    read_only: true
    security_opt:
      - no-new-privileges:true

  bridge:
    image: ghcr.io/longern/webtransport-bridge:latest
    restart: unless-stopped
    depends_on: [nas]
    ports:
      - "${BRIDGE_PORT:-4433}:4433/udp"
    environment:
      CERT_WEBHOOK_URL: ${CERT_WEBHOOK_URL:?Set the private certificate webhook URL}
    command:
      - --backend=http://nas:8080
      - --origins=${SITE_ORIGIN:?Set the frontend HTTPS origin without a trailing slash}
      - --public
      - --paths=/dav,/api
      - --methods=*
      - --auto-cert
      - --cert-dir=/certs
    volumes:
      - bridge-certs:/certs
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

volumes:
  nas-data:
  bridge-certs:
